name: Go checks

on:
  push:
    branches:
      - feat/issue-worker-mvp
  pull_request:
    branches:
      - feat/issue-worker-mvp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
